services:
  database:
    build:
      context: ./src/database
      dockerfile: Dockerfile
    image: fitsync-mysql:8.4
    container_name: fitsync-mysql
    restart: unless-stopped

    env_file:
      - ./.env

    environment:
      MYSQL_DATABASE: fitsync
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - fitsync-mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  fitsync-mysql-data: