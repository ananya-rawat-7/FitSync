services:
  database:
    build:
      context: ./src/database
      dockerfile: Dockerfile
    image: fitsync-mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fitsync
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in src/backend/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in src/backend/.env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - fitsync-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fitsync-mysql-data:
