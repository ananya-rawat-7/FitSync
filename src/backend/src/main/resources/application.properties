spring.config.import=optional:file:../../.env[.properties]
spring.datasource.url=${FITSYNC_DB_URL}
spring.datasource.username=${FITSYNC_DB_USER}
spring.datasource.password=${FITSYNC_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
fitsync.jwt.secret=${JWT_SECRET}
fitsync.jwt.expiration-ms=${JWT_EXPIRATION_MS}
fitsync.cors.allowed-origins=${FITSYNC_CORS_ALLOWED_ORIGINS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT}
