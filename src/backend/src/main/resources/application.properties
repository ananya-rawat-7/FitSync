spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${FITSYNC_DB_URL:jdbc:mysql://localhost:3307/fitsync?createDatabaseIfNotExist=true}
spring.datasource.username=${FITSYNC_DB_USER:root}
spring.datasource.password=${FITSYNC_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
fitsync.jwt.secret=${JWT_SECRET:}
fitsync.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT:8080}
