spring.application.name=fitsync
server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:mem:fitsync;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
fitsync.jwt.secret=${JWT_SECRET:U2VjdXJlS0VZVG9rZW4xMjM0NTY3ODkwQmFzZTY0Q29kZQ==}
fitsync.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
server.error.include-message=never
spring.h2.console.enabled=true