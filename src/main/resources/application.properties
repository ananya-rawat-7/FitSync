spring.application.name=fitsync
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitsync?serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:fitsync_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
fitsync.jwt.secret=${JWT_SECRET}
fitsync.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
server.error.include-message=never